<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на День Рождения</title>
    <style>
        :root {
            --rose-gold: #B76E79;
            --cream: #FDFBF7;
            --text-color: #4A4A4A;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--cream);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--rose-gold);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
        }
        form {
            margin-top: 30px;
            text-align: left;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
        }
        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }
        button {
            background-color: var(--rose-gold);
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 1.1rem;
            border-radius: 30px;
            margin-top: 20px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Приглашение</h1>
        <p>Приглашаю тебя отметить мой особенный день!</p>
        
        <!-- Action URL should be replaced with Google Forms/Sheet endpoint -->
        <form action="YOUR_GOOGLE_FORM_ACTION_URL" method="POST">
            <label for="name">Твое имя:</label>
            <input type="text" id="name" name="entry.123456789" required>
            
            <label for="attendance">Будешь ли ты?</label>
            <select id="attendance" name="entry.987654321">
                <option value="Да, буду!">Да, буду!</option>
                <option value="К сожалению, не смогу">К сожалению, не смогу</option>
            </select>
            
            <label for="drink">Предпочтения по напиткам:</label>
            <select id="drink" name="entry.555666777">
                <option value="Шампанское">Шампанское</option>
                <option value="Вино">Вино</option>
                <option value="Коктейли">Коктейли</option>
                <option value="Безалкогольное">Безалкогольное</option>
            </select>
            
            <button type="submit">Отправить ответ</button>
        </form>
    </div>
</body>
</html>
